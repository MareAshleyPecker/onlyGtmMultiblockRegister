# ════════════════════════════════════════════════════════════════
#  onlyGtmMultiblockRegister (ogmr) —— 独立的多方块/仓室/UI/配方 注册工具库
#  （不依赖 GTCEu；GTM 仅作为设计参考）
# ════════════════════════════════════════════════════════════════
org.gradle.jvmargs=-Xms128m -Xmx3g -XX:MaxMetaspaceSize=512m -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
# ⚠️ 本机 Gradle 8.8 跑不了 Java 25，必须把 Gradle 自己的 JVM 钉到 JDK 17
#    （与 D:\java\GregTech-Modern-7.5.3-1.20.1 的写法一致；换机器要改这一行）
org.gradle.java.home=D:/.gradle/jdks/eclipse_adoptium-17-amd64-windows/jdk-17.0.20.1+1
org.gradle.java.installations.auto-download=false
# 本机网络会拦 TLS，导致 ForgeGradle 启动时校验 maven.minecraftforge.net 证书失败（偶发）
systemProp.net.minecraftforge.gradle.check.certs=false

# ---- Minecraft / Forge ----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)

mapping_channel=official
mapping_version=1.20.1

# ---- Mod 元信息 ----
mod_id=ogmr
mod_name=Only GT Multiblock Register
mod_license=LGPL-3.0
mod_version=1.0.0
mod_group_id=rain.fox
mod_authors=RainFoxStar
mod_description=A standalone utility library for registering GregTech Modern multiblocks, hatches/parts, machine UIs, .rtui recipe-type UIs, RecipeTypes and recipes. Also ships a Java rewrite of the modular-machine and threaded-recipe subsystems.

# ---- 依赖版本（与 GTEternalTime core / GTM 7.5.3 对齐）----
gtm_version=7.5.3
ldlib_version=7809449
ldlib_project=626676
configuration_version=2.2.0
lombok_version=1.18.30
mixin_version=0.8.5
# JEI（需求 6：多方块预览界面）—— 只编译期依赖，玩家侧可选
# ⚠️ 本机离线缓存里 15.20.0.132 缺 jei-1.20.1-common-api 的 jar；15.20.0.130 是一整套完整的
jei_version=15.20.0.130

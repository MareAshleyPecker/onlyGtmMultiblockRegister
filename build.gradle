buildscript {
    repositories {
        // 国内镜像优先，官方兜底
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

apply plugin: 'maven-publish'

group = mod_group_id
version = mod_version
base { archivesName = mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing',
                    file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// datagen 会在 src/generated/resources 下写一个 .cache（增量哈希表），它不该进 jar
tasks.named('processResources', ProcessResources).configure {
    exclude '.cache/**'
}

// 本库自己没有 mixin，所以不声明 mixin 配置、也不生成 refmap —— 这个空块只是让 MixinGradle 生效：
// 它会给 run* 注入 refmap 重映射，缺了它依赖（LDLib）里的 mixin 在开发环境会以
// InvalidAccessorException 启动失败。
mixin {}

repositories {
    mavenLocal()
    flatDir { dir 'libs' }

    // 国内镜像
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
    maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }

    // 官方源
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content { includeGroup 'com.gregtechceu.gtceu' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // LDLib2：UI 与方块实体同步的底座（本库不依赖 GTCEu，GTM 的注册逻辑已拆进源码）
    implementation(fg.deobf("curse.maven:ldlib-${ldlib_project}:${ldlib_version}")) { transitive = false }

    // JEI：只编译期需要，玩家侧可选；-PenableJei=false 可在没有 JEI 的环境下构建
    if (project.hasProperty('enableJei') ? project.property('enableJei').toBoolean() : true) {
        // 只声明两个 API jar：jei-*-forge 整包的 POM 会拽出 core/common/lib/gui 一串内部模块，
        // ForgeGradle 的 __obfuscated 配置解析不了它们会让整个构建失败
        compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")) { transitive = false }
        compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")) { transitive = false }
    }

    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    // ═══ 可选集成（全部注释掉：编译和运行都不需要它们）═══
    // 这三家对外都走 Forge Energy，接线只要 EnergyContainer#asForgeStorage()；
    // 能量单位口径已在 EnergyTypes 对齐（AE = 2 FE / RF = 1 FE / J = 0.4 FE）。
    //
    // AE2（应用能源 2）—— 需要 guide-me 作前置
    // implementation fg.deobf("curse.maven:guideme-1173950:8204776")
    // implementation fg.deobf("curse.maven:applied-energistics-2-223794:7148487")
    // implementation fg.deobf("appeng:appliedenergistics2-forge:15.4.2")
    //
    // 热力膨胀 / CoFH（RF 就是 FE）
    // implementation fg.deobf("curse.maven:cofh-core-69162:5374122")
    // implementation fg.deobf("curse.maven:thermal-foundation-222880:5443583")
    // implementation fg.deobf("curse.maven:thermal-expansion-69163:5372749")
    // implementation fg.deobf("curse.maven:thermal-dynamics-227443:5372747")
    // implementation fg.deobf("curse.maven:thermal-innovation-291737:5372751")
    // implementation fg.deobf("curse.maven:thermal-cultivation-271835:5372746")
    // implementation fg.deobf("curse.maven:thermal-locomotion-406959:5372752")
    // implementation fg.deobf("curse.maven:thermal-integration-626708:5374210")
    //
    // Mekanism（通用机械）
    // implementation fg.deobf("curse.maven:mekanism-268560:6552911")
    // implementation fg.deobf("curse.maven:mekanism-generators-268566:6552914")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-removal'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${mod_id}-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localLibs'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
